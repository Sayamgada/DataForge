name: DataForge CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Flake8
        run: flake8 app tests

      - name: Run Pytest
        run: pytest

  docker:
    name: Build, Test and Publish Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/dataforge:latest \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/dataforge:${{ github.sha }} .

      - name: Start Docker container
        run: |
          docker run -d \
            --name dataforge-test \
            -p 8000:8000 \
            ${{ secrets.DOCKERHUB_USERNAME }}/dataforge:${{ github.sha }}

      - name: Wait for application
        run: |
          for i in {1..20}; do
            if curl --fail http://localhost:8000/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs dataforge-test
          exit 1

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/dataforge:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/dataforge:${{ github.sha }}

      - name: Stop Docker container
        if: always()
        run: docker rm -f dataforge-test
