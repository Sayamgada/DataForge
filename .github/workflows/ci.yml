name: DataForge CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Flake8
        run: flake8 app tests

      - name: Run Pytest
        run: pytest

  docker:
    name: Build and Test Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t dataforge-csv-service:ci .

      - name: Start Docker container
        run: |
          docker run -d \
            --name dataforge-test \
            -p 8000:8000 \
            dataforge-csv-service:ci

      - name: Wait for application
        run: |
          for i in {1..20}; do
            if curl --fail http://localhost:8000/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs dataforge-test
          exit 1

      - name: Stop Docker container
        if: always()
        run: docker rm -f dataforge-test
